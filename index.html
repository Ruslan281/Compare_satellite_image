<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GeoSlice</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

  <!-- ArcGIS Maps SDK for JavaScript -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css"/>
  <script src="https://js.arcgis.com/4.30/"></script>

  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <!-- ══ HEADER ══════════════════════════════════ -->
  <header class="header">
    <div class="header-brand">
      <div class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="1" y="1" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <line x1="10" y1="1" x2="10" y2="19" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="10" cy="10" r="2.5" fill="currentColor"/>
        </svg>
      </div>
      <span class="brand-name">GeoSlice</span>
    </div>

    <div class="header-coords">
      <span class="coord-item"><span class="coord-key">LAT</span><span class="coord-val" id="cLat">—</span></span>
      <span class="coord-divider"></span>
      <span class="coord-item"><span class="coord-key">LON</span><span class="coord-val" id="cLon">—</span></span>
      <span class="coord-divider"></span>
      <span class="coord-item"><span class="coord-key">Z</span><span class="coord-val" id="cZoom">—</span></span>
    </div>

    <div class="header-actions">
      <button class="hbtn" id="btnHome" title="Görüntüyə qayıt">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 6.5L8 2l6 4.5V14a1 1 0 01-1 1H3a1 1 0 01-1-1V6.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="hbtn" id="btnBasemap" title="Altlıq xəritə">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/>
          <rect x="9" y="1" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/>
          <rect x="1" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/>
          <rect x="9" y="9" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
      <button class="hbtn" id="btnFullscreen" title="Tam ekran">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M1 1h4M1 1v4M15 1h-4M15 1v4M1 15h4M1 15v-4M15 15h-4M15 15v-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ══ LAYER PANEL ══════════════════════════════ -->
  <aside class="panel" id="layerPanel">
    <div class="panel-head">
      <span class="panel-title">Laylar</span>
      <button class="panel-close" id="panelClose">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="panel-body">
      <div class="panel-section">
        <div class="section-label">Sol görüntü</div>
        <div class="layer-list" id="leftLayers"></div>
      </div>

      <div class="panel-section">
        <div class="section-label">Sağ görüntü</div>
        <div class="layer-list" id="rightLayers"></div>
      </div>

      <div class="panel-section">
        <div class="section-label">Altlıq xəritə</div>
        <div class="layer-list" id="basemapList"></div>
      </div>
    </div>
  </aside>

  <button class="panel-open-btn" id="panelOpenBtn" style="display:none">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <rect x="1" y="3" width="14" height="1.5" rx=".75" fill="currentColor"/>
      <rect x="1" y="7.25" width="14" height="1.5" rx=".75" fill="currentColor"/>
      <rect x="1" y="11.5" width="14" height="1.5" rx=".75" fill="currentColor"/>
    </svg>
  </button>

  <!-- ══ XƏRİTƏ ═══════════════════════════════════ -->
  <div id="viewDiv"></div>

  <!-- Yan etiketlər -->
  <div class="map-badge left-badge"  id="leftBadge">Sol</div>
  <div class="map-badge right-badge" id="rightBadge">Sağ</div>

  <!-- ══ LOADING ══════════════════════════════════ -->
  <div class="loading" id="loading">
    <div class="loading-box">
      <div class="loading-ring"></div>
      <div class="loading-label" id="loadingLabel">Yüklənir…</div>
      <div class="loading-sub" id="loadingSub">COG faylı oxunur</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
