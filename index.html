<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GeoSlice</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css"/>
<script src="https://js.arcgis.com/4.30/"></script>

<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- ══════ HEADER ══════ -->
<header class="hdr">
  <div class="hdr-brand">
    <svg class="mark" width="18" height="18" viewBox="0 0 18 18" fill="none">
      <rect x="1" y="1" width="16" height="16" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
      <path d="M9 1v16" stroke="currentColor" stroke-width="1.3"/>
      <path d="M1 9h16" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 2"/>
    </svg>
    <span class="wordmark">GeoSlice</span>
  </div>

  <div class="hdr-readout">
    <span class="ro"><i>φ</i><b id="cLat">—</b></span>
    <span class="ro"><i>λ</i><b id="cLon">—</b></span>
    <span class="ro"><i>z</i><b id="cZoom">—</b></span>
  </div>

  <div class="hdr-tools">
    <button class="tool" id="btnHome" title="Görüntüyə qayıt">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <path d="M2.5 6.8L8 2.5l5.5 4.3V13a.8.8 0 01-.8.8H3.3a.8.8 0 01-.8-.8V6.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="tool" id="btnPanel" title="Panel">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <rect x="2" y="2" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M2 6.5h12" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </button>
    <button class="tool" id="btnFull" title="Tam ekran">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <path d="M2 5.5V2.5h3M14 5.5V2.5h-3M2 10.5v3h3M14 10.5v3h-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>

<!-- ══════ XƏRİTƏ ══════ -->
<div id="viewDiv"></div>

<!-- Yan nişanlar -->
<div class="tag tag-l" id="tagL">—</div>
<div class="tag tag-r" id="tagR">—</div>

<!-- ══════ NƏZARƏT KARTI ══════ -->
<section class="ctrl" id="ctrl">

  <div class="ctrl-row">
    <div class="ctrl-head">
      <span class="ctrl-label">Sol</span>
      <button class="eye" id="eyeL" title="Görünürlük"></button>
    </div>
    <div class="seg" id="segL"></div>
  </div>

  <div class="ctrl-row">
    <div class="ctrl-head">
      <span class="ctrl-label">Sağ</span>
      <button class="eye" id="eyeR" title="Görünürlük"></button>
    </div>
    <div class="seg" id="segR"></div>
  </div>

  <div class="ctrl-rule"></div>

  <div class="ctrl-row">
    <div class="ctrl-head">
      <span class="ctrl-label">Altlıq</span>
    </div>
    <div class="chips" id="chipsBase"></div>
  </div>

</section>

<!-- ══════ YÜKLƏNMƏ ══════ -->
<div class="load" id="load">
  <div class="load-inner">
    <div class="load-mark">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="15" stroke="currentColor" stroke-width="1.5" opacity=".15"/>
        <path d="M17 2a15 15 0 0115 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="load-t" id="loadT">Servis açılır</div>
    <div class="load-s" id="loadS">ArcGIS Online</div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
