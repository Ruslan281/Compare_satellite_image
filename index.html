<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GeoSlice</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css"/>
<script src="https://js.arcgis.com/4.30/"></script>

<link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- ═══ BAŞLIQ ═══ -->
<header class="hdr">
  <div class="brand">
    <svg class="brand-mark" width="16" height="16" viewBox="0 0 16 16" fill="none">
      <rect x=".8" y=".8" width="14.4" height="14.4" rx="1.2" stroke="currentColor" stroke-width="1.2"/>
      <path d="M8 .8v14.4" stroke="currentColor" stroke-width="1.2"/>
    </svg>
    <span class="brand-text">GeoSlice</span>
  </div>

  <div class="readout">
    <span class="rd"><em>φ</em><b id="cLat">—</b></span>
    <span class="rd"><em>λ</em><b id="cLon">—</b></span>
    <span class="rd"><em>z</em><b id="cZoom">—</b></span>
  </div>

  <div class="tools">
    <button class="tool" id="btnHome" title="Görüntüyə qayıt">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <path d="M2.6 6.9L8 2.6l5.4 4.3v6.1a.7.7 0 01-.7.7H3.3a.7.7 0 01-.7-.7V6.9z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="tool" id="btnPanel" title="Panel">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <rect x="1.6" y="2.4" width="12.8" height="11.2" rx="1.3" stroke="currentColor" stroke-width="1.25"/>
        <path d="M9.6 2.4v11.2" stroke="currentColor" stroke-width="1.25"/>
      </svg>
    </button>
    <button class="tool" id="btnFull" title="Tam ekran">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <path d="M2.2 5.8V2.6h3.2M13.8 5.8V2.6h-3.2M2.2 10.2v3.2h3.2M13.8 10.2v3.2h-3.2" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>

<!-- ═══ XƏRİTƏ ═══ -->
<div id="viewDiv"></div>

<!-- ═══ PANEL (sağ yuxarı) ═══ -->
<aside class="panel" id="panel">

  <div class="panel-top">
    <span class="panel-title">Təbəqələr</span>
    <button class="panel-x" id="panelX" aria-label="Bağla">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
        <path d="M3.2 3.2l7.6 7.6M10.8 3.2l-7.6 7.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <section class="src" id="srcL">
    <header class="src-top">
      <span class="src-bar"></span>
      <div class="src-id">
        <span class="src-name" id="nameL">—</span>
        <span class="src-meta" id="metaL">—</span>
      </div>
      <button class="vis" id="visL" aria-label="Görünürlük"></button>
    </header>
    <div class="opts" id="optsL"></div>
  </section>

  <section class="src" id="srcR">
    <header class="src-top">
      <span class="src-bar"></span>
      <div class="src-id">
        <span class="src-name" id="nameR">—</span>
        <span class="src-meta" id="metaR">—</span>
      </div>
      <button class="vis" id="visR" aria-label="Görünürlük"></button>
    </header>
    <div class="opts" id="optsR"></div>
  </section>

  <section class="base">
    <div class="base-lbl">Altlıq xəritə</div>
    <div class="base-row" id="baseRow"></div>
  </section>

</aside>

<!-- ═══ YÜKLƏNMƏ ═══ -->
<div class="load" id="load">
  <div class="load-in">
    <div class="load-spin">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <circle cx="15" cy="15" r="13" stroke="currentColor" stroke-width="1.6" opacity=".14"/>
        <path d="M15 2a13 13 0 0113 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="load-t" id="loadT">Yüklənir</div>
    <div class="load-s" id="loadS">servis oxunur</div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
